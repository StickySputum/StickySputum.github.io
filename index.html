<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь смен</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header>
        <h1><i class="fa-solid fa-calendar-days"></i> Календарь смен</h1>
        <div id="userProfile" class="user-profile">
            <i class="fa-solid fa-user"></i> <span id="roleDisplay">Загрузка...</span>
            <button id="logoutBtn" title="Сменить пользователя"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <div class="controls panel">
        <div class="control-group">
            <label for="month"><i class="fa-regular fa-calendar"></i> Месяц:</label>
            <select id="month"></select>
        </div>
        <div class="control-group">
            <label for="year"><i class="fa-solid fa-calendar-week"></i> Год:</label>
            <select id="year"></select>
        </div>
    </div>

    <div class="legend panel">
        <div class="legend-item"><div class="color-box worker-color"></div> Твоя смена</div>
        <div class="legend-item"><div class="color-box owner-color"></div> Смена напарника</div>
        <div class="legend-item"><div class="color-box off-color"></div> Выходной</div>
    </div>

    <div class="wrapper">
        <div id="calendar" class="calendar-grid"></div>
    </div>

    <div class="actions">
        <button id="saveScheduleBtn" class="btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Отправить расписание
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
